# fluent-bit.conf — pipeline de logs: lee los ficheros de log de Docker y los
# envía a Elasticsearch.
#
# El formato es "clásico" de Fluent Bit: bloques [SECCION] con pares clave-valor
# indentados. Los comentarios van con '#'.
#
# El pipeline es: INPUT (de dónde leo) -> FILTER (cómo transformo) -> OUTPUT (a dónde envío).

[SERVICE]
    # Cada cuántos SEGUNDOS vacía el buffer hacia la salida.
    Flush             1
    # Off = corre en primer plano. Obligatorio en contenedores: si se demonizara,
    # el proceso principal terminaría y Docker daría el contenedor por muerto.
    Daemon            Off
    # Verbosidad de los logs de Fluent Bit MISMO (no de los que recolecta).
    # Ponlo en 'debug' si algo no llega a Elasticsearch.
    Log_Level         info
    # Carga los parsers que ya trae la imagen; entre ellos el parser 'docker'
    # que usamos abajo.
    Parsers_File      parsers.conf

[INPUT]
    # Plugin 'tail': sigue ficheros y lee las líneas nuevas, como un 'tail -f'.
    #
    # Es el MISMO patrón que se usa en Kubernetes, donde Fluent Bit se despliega
    # como DaemonSet y lee los ficheros de logs de cada nodo. Por eso elegí este
    # método: lo aprendido aquí se reutiliza en el módulo de Kubernetes.
    #
    # OJO: sólo funciona en Docker sobre Linux nativo. En Docker Desktop/WSL2
    # estos ficheros viven dentro de la VM interna de Docker y un bind mount
    # los ve vacíos (comprobado). Ver ADR.
    Name              tail
    # Etiqueta interna con la que Fluent Bit enruta estos registros.
    # El OUTPUT decide qué procesa según esta etiqueta (ver 'Match').
    Tag               docker.*
    # Los logs de TODOS los contenedores. Docker (driver json-file) escribe el
    # stdout/stderr de cada contenedor en un fichero por ID.
    Path              /var/lib/docker/containers/*/*-json.log
    # Cada línea de esos ficheros es un JSON con los campos log/stream/time.
    # Este parser lo desmonta para que no llegue a ES como un texto plano.
    Parser            docker
    # Base de datos SQLite donde guarda por qué byte va en cada fichero.
    # Es lo que le permite RETOMAR donde iba tras un reinicio y no duplicar.
    DB                /var/log/flb/docker.db
    # Tope de memoria del buffer de esta entrada: si llegan logs más rápido de
    # lo que ES los acepta, no se come toda la RAM.
    Mem_Buf_Limit     5MB
    # Descarta líneas gigantes en lugar de atascarse con ellas.
    Skip_Long_Lines   On
    # Cada cuántos segundos rebusca ficheros nuevos (contenedores recién creados).
    Refresh_Interval  5

[FILTER]
    # 'modify' permite añadir, renombrar o quitar campos.
    # Aquí solo marco de dónde vienen los logs: útil cuando en el futuro haya
    # varias fuentes (host, otro entorno...) apuntando al mismo Elasticsearch.
    Name              modify
    Match             *
    Add               entorno docker-lab

[OUTPUT]
    # Plugin de salida de Elasticsearch.
    Name              es
    # Qué etiquetas envía. '*' = todas las que produzca el pipeline.
    Match             *
    # Por nombre de servicio: lo resuelve el DNS interno de Docker porque
    # fluent-bit y elasticsearch comparten la red 'logging'.
    Host              elasticsearch
    Port              9200
    # Crea UN ÍNDICE POR DÍA en vez de uno único enorme. Es la convención
    # estándar y facilita borrar los logs viejos (basta con borrar índices).
    Logstash_Format   On
    # Prefijo del índice: quedará como docker-lab-AAAA.MM.DD
    Logstash_Prefix   docker-lab
    # Guarda la ETIQUETA de Fluent Bit como un campo del documento.
    # Sin esto no hay forma de saber de qué contenedor viene cada línea: la
    # identidad va en la etiqueta (que incluye la ruta del fichero, y ahí el ID
    # del contenedor), y por defecto el plugin de ES no la persiste.
    Include_Tag_Key   On
    # Nombre del campo donde aterriza la etiqueta.
    Tag_Key           tag
    # IMPORTANTE con Elasticsearch 8 y 9: los "types" de índice se eliminaron.
    # Sin esto, Fluent Bit enviaría un campo _type que ES rechaza.
    Suppress_Type_Name On
    # Si ES rechaza un registro, escribe el motivo en los logs de Fluent Bit.
    # Imprescindible para depurar (sin esto los fallos son silenciosos).
    Trace_Error       On
    # False = reintenta indefinidamente si ES no está disponible.
    Retry_Limit       False
