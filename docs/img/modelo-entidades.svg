<svg viewBox="0 0 980 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Modelo de entidades de nutriapp</title>
<desc id="d">Diagrama entidad-relación con las siete entidades: User, Plan, Analisis, ComidaPlanificada, Receta, IngredienteReceta y Alimento, con sus claves foráneas y cardinalidades.</desc>

<style>
  .ttl { font: 600 16px system-ui, sans-serif; fill: #1a1a1a; }
  .sub { font: 400 11.5px system-ui, sans-serif; fill: #6b6b6b; }
  .ent { font: 600 13px system-ui, sans-serif; fill: #1a1a1a; }
  .att { font: 400 10.5px ui-monospace, Menlo, Consolas, monospace; fill: #2f2f2f; }
  .fk  { fill: #7a3520; }
  .pk  { fill: #1a1a1a; font-weight: 700; }
  .car { font: 600 11px system-ui, sans-serif; fill: #6b6b6b; }
  .rel { font: 400 10px system-ui, sans-serif; fill: #6b6b6b; }
  .relb{ font: 600 10.5px system-ui, sans-serif; fill: #6b6b6b; }

  .bxu { fill: #eef2f6; stroke: #7e97ae; stroke-width: 1.4; }
  .bxc { fill: #eef4ef; stroke: #7fa389; stroke-width: 1.6; }
  .hdu { fill: #dce6ee; }
  .hdc { fill: #dcebe0; }
  .nota{ fill: #faf9f7; stroke: #d9d7d2; stroke-width: 1; }
  .ln  { stroke: #8a8880; stroke-width: 1.5; fill: none; }
  .lnd { stroke: #a8a6a0; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
</style>

<defs>
  <marker id="m" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#8a8880"/>
  </marker>
  <marker id="md" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#a8a6a0"/>
  </marker>
</defs>

<rect x="0" y="0" width="980" height="750" fill="#ffffff"/>

<text x="24" y="30" class="ttl">Modelo de entidades — nutriapp</text>
<text x="24" y="50" class="sub">Cantidades siempre en CRUDO · verde = catálogo compartido · azul = datos del usuario · ⟨opc⟩ = campo opcional</text>

<!-- ===== USER ===== -->
<rect x="24" y="70" width="290" height="252" rx="6" class="bxu"/>
<rect x="24" y="70" width="290" height="26" rx="6" class="hdu"/>
<rect x="24" y="88" width="290" height="8" class="hdu" stroke="none"/>
<text x="36" y="88" class="ent">User</text>
<text x="36" y="114" class="att"><tspan class="pk">id</tspan></text>
<text x="36" y="129" class="att">email · password_hash</text>
<text x="36" y="144" class="att">nombre</text>
<text x="36" y="159" class="att">sexo · fecha_nacimiento</text>
<text x="36" y="174" class="att">altura_cm · peso_kg</text>
<text x="36" y="189" class="att">nivel_actividad</text>
<text x="36" y="204" class="att">objetivo</text>
<text x="36" y="219" class="att">comidas_por_dia</text>
<text x="36" y="234" class="att">preferencia_alimentaria</text>
<text x="36" y="249" class="att">composicion_corporal</text>
<text x="36" y="264" class="att">perimetro_cintura_cm  <tspan class="rel">⟨opc⟩</tspan></text>
<text x="36" y="279" class="att">perimetro_cadera_cm  <tspan class="rel">⟨opc⟩</tspan></text>
<text x="36" y="294" class="att">perimetro_cuello_cm  <tspan class="rel">⟨opc⟩</tspan></text>
<text x="36" y="313" class="rel">IMC y edad NO se guardan: se calculan.</text>

<!-- User -> Plan -->
<path d="M316,140 L336,140" class="ln" marker-end="url(#m)"/>
<text x="326" y="132" class="car" text-anchor="middle">1:N</text>

<!-- ===== PLAN ===== -->
<rect x="338" y="70" width="272" height="150" rx="6" class="bxu"/>
<rect x="338" y="70" width="272" height="26" rx="6" class="hdu"/>
<rect x="338" y="88" width="272" height="8" class="hdu" stroke="none"/>
<text x="350" y="88" class="ent">Plan</text>
<text x="350" y="114" class="att"><tspan class="pk">id</tspan></text>
<text x="350" y="129" class="att"><tspan class="fk">user_id →</tspan></text>
<text x="350" y="144" class="att">nombre</text>
<text x="350" y="159" class="att">activo  <tspan class="rel">(solo uno por usuario)</tspan></text>
<text x="350" y="174" class="att">origen  <tspan class="rel">(ia | manual)</tspan></text>
<text x="350" y="189" class="att">creado_en</text>
<text x="350" y="208" class="rel">Plantilla semanal: se repite hasta cambiarla</text>

<!-- Plan -> Analisis -->
<path d="M612,140 L626,140" class="lnd" marker-end="url(#md)"/>
<text x="619" y="132" class="car" text-anchor="middle">1:N</text>

<!-- ===== ANALISIS ===== -->
<rect x="628" y="70" width="328" height="150" rx="6" class="bxu"/>
<rect x="628" y="70" width="328" height="26" rx="6" class="hdu"/>
<rect x="628" y="88" width="328" height="8" class="hdu" stroke="none"/>
<text x="640" y="88" class="ent">Analisis</text>
<text x="640" y="114" class="att"><tspan class="pk">id</tspan></text>
<text x="640" y="129" class="att"><tspan class="fk">user_id →</tspan>  ·  <tspan class="fk">plan_id →</tspan></text>
<text x="640" y="144" class="att">estado  <tspan class="rel">(pendiente · procesando · completado · fallido)</tspan></text>
<text x="640" y="159" class="att">entrada · resultado  <tspan class="rel">(JSON)</tspan></text>
<text x="640" y="174" class="att">error · intentos</text>
<text x="640" y="189" class="att">creado_en · actualizado_en</text>
<text x="640" y="208" class="rel">Trabajo asíncrono: lo procesa el worker</text>

<!-- Plan -> ComidaPlanificada -->
<path d="M474,222 L474,242" class="ln" marker-end="url(#m)"/>
<text x="490" y="238" class="car">1:N</text>

<!-- ===== COMIDA PLANIFICADA ===== -->
<rect x="338" y="244" width="272" height="150" rx="6" class="bxu"/>
<rect x="338" y="244" width="272" height="26" rx="6" class="hdu"/>
<rect x="338" y="262" width="272" height="8" class="hdu" stroke="none"/>
<text x="350" y="262" class="ent">ComidaPlanificada</text>
<text x="350" y="288" class="att"><tspan class="pk">id</tspan></text>
<text x="350" y="303" class="att"><tspan class="fk">plan_id →</tspan></text>
<text x="350" y="318" class="att">dia_semana  <tspan class="rel">(lunes … domingo)</tspan></text>
<text x="350" y="333" class="att">momento  <tspan class="rel">(desayuno … cena)</tspan></text>
<text x="350" y="348" class="att"><tspan class="fk">receta_id →</tspan></text>
<text x="350" y="363" class="att">raciones</text>
<text x="350" y="382" class="rel">Día de la semana, no fecha del calendario</text>

<!-- ComidaPlanificada -> Receta -->
<path d="M612,310 L626,310" class="ln" marker-end="url(#m)"/>
<text x="619" y="302" class="car" text-anchor="middle">N:1</text>

<!-- ===== RECETA ===== -->
<rect x="628" y="244" width="328" height="150" rx="6" class="bxu"/>
<rect x="628" y="244" width="328" height="26" rx="6" class="hdu"/>
<rect x="628" y="262" width="328" height="8" class="hdu" stroke="none"/>
<text x="640" y="262" class="ent">Receta</text>
<text x="640" y="288" class="att"><tspan class="pk">id</tspan></text>
<text x="640" y="303" class="att"><tspan class="fk">user_id →</tspan>  <tspan class="rel">(nulo = receta del sistema)</tspan></text>
<text x="640" y="318" class="att">nombre · pasos</text>
<text x="640" y="333" class="att">metodo_coccion  <tspan class="rel">(plancha · horno · hervido …)</tspan></text>
<text x="640" y="348" class="att">raciones</text>
<text x="640" y="363" class="att">origen  <tspan class="rel">(ia | manual)</tspan></text>

<!-- Receta -> IngredienteReceta -->
<path d="M790,396 L790,414" class="ln" marker-end="url(#m)"/>
<text x="806" y="410" class="car">1:N</text>

<!-- ===== INGREDIENTE RECETA ===== -->
<rect x="628" y="416" width="328" height="118" rx="6" class="bxu"/>
<rect x="628" y="416" width="328" height="26" rx="6" class="hdu"/>
<rect x="628" y="434" width="328" height="8" class="hdu" stroke="none"/>
<text x="640" y="434" class="ent">IngredienteReceta</text>
<text x="640" y="460" class="att"><tspan class="pk">id</tspan></text>
<text x="640" y="475" class="att"><tspan class="fk">receta_id →</tspan>  ·  <tspan class="fk">alimento_id →</tspan></text>
<text x="640" y="490" class="att">gramos  <tspan class="rel">(en crudo)</tspan></text>
<text x="640" y="512" class="rel">Resuelve la relación muchos-a-muchos y</text>
<text x="640" y="525" class="rel">guarda la cantidad, que no pertenece al alimento</text>

<!-- IngredienteReceta -> Alimento -->
<path d="M626,470 L612,470" class="ln" marker-end="url(#m)"/>
<text x="619" y="462" class="car" text-anchor="middle">N:1</text>

<!-- ===== ALIMENTO ===== -->
<rect x="338" y="416" width="272" height="240" rx="6" class="bxc"/>
<rect x="338" y="416" width="272" height="26" rx="6" class="hdc"/>
<rect x="338" y="434" width="272" height="8" class="hdc" stroke="none"/>
<text x="350" y="434" class="ent">Alimento</text>
<text x="350" y="460" class="att"><tspan class="pk">id</tspan></text>
<text x="350" y="475" class="att">nombre  <tspan class="rel">(específico)</tspan></text>
<text x="350" y="490" class="att">categoria · estado</text>
<text x="350" y="505" class="att">energia_kcal</text>
<text x="350" y="520" class="att">grasas_g · grasas_saturadas_g</text>
<text x="350" y="535" class="att">hidratos_g · azucares_g</text>
<text x="350" y="550" class="att">fibra_g · proteinas_g</text>
<text x="350" y="565" class="att">sal_g</text>
<text x="350" y="580" class="att">nutrientes_extra  <tspan class="rel">(JSON)</tspan></text>
<text x="350" y="595" class="att">origen  <tspan class="rel">(seed | api | manual)</tspan></text>
<text x="350" y="610" class="att">id_externo · nombre_externo</text>
<text x="350" y="631" class="rel">Todo por 100 g · los 8 campos fijos son</text>
<text x="350" y="644" class="rel">el etiquetado obligatorio de la UE</text>

<!-- ===== NOTA: listas cerradas ===== -->
<rect x="24" y="336" width="290" height="150" rx="6" class="nota"/>
<text x="38" y="358" class="ent">Listas cerradas</text>
<text x="38" y="379" class="att">objetivo</text>
<text x="38" y="392" class="rel">perder_grasa · mantener · ganar_musculo</text>
<text x="38" y="410" class="att">nivel_actividad</text>
<text x="38" y="423" class="rel">sedentario · ligero · moderado · alto</text>
<text x="38" y="441" class="att">composicion_corporal</text>
<text x="38" y="454" class="rel">percepción del propio usuario, complementa</text>
<text x="38" y="467" class="rel">al IMC, que no distingue músculo de grasa</text>

<!-- ===== NOTA: lista de la compra ===== -->
<rect x="24" y="500" width="290" height="156" rx="6" class="nota"/>
<text x="38" y="522" class="ent">La lista de la compra no es una tabla</text>
<text x="38" y="543" class="rel">Se calcula al vuelo: recorre las comidas del plan</text>
<text x="38" y="556" class="rel">y suma los gramos por alimento.</text>
<text x="38" y="576" class="att">?semanas=1..4</text>
<text x="38" y="589" class="rel">Como el plan es una plantilla semanal, pedir</text>
<text x="38" y="602" class="rel">varias semanas es multiplicar el resultado.</text>
<text x="38" y="622" class="rel">Al no guardarse, nunca queda desfasada</text>
<text x="38" y="635" class="rel">respecto al plan.</text>

<text x="24" y="690" class="relb">→ = clave foránea    ·    1:N = uno a muchos    ·    N:1 = muchos a uno    ·    discontinua = opcional</text>
<text x="24" y="710" class="rel">Un plan pertenece a UN usuario: lleva sus calorías y su objetivo. Si dos personas siguieran "el mismo" plan, cada una tendría su copia.</text>
<text x="24" y="728" class="rel">Se guarda el dato estable (fecha de nacimiento, peso, altura) y se deriva el volátil (edad, IMC). Nunca al revés.</text>
</svg>
