<svg viewBox="0 0 980 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Modelo de entidades de nutriapp</title>
<desc id="d">Diagrama entidad-relación con las siete entidades de la aplicación: User, Plan, Analisis, ComidaPlanificada, Receta, IngredienteReceta y Alimento, indicando claves foráneas y cardinalidades.</desc>

<style>
  .ttl { font: 600 16px system-ui, sans-serif; fill: #1a1a1a; }
  .sub { font: 400 11.5px system-ui, sans-serif; fill: #6b6b6b; }
  .ent { font: 600 13px system-ui, sans-serif; fill: #1a1a1a; }
  .att { font: 400 11px ui-monospace, Menlo, Consolas, monospace; fill: #2f2f2f; }
  .fk  { fill: #7a3520; }
  .pk  { fill: #1a1a1a; font-weight: 700; }
  .car { font: 600 11px system-ui, sans-serif; fill: #6b6b6b; }
  .rel { font: 400 10.5px system-ui, sans-serif; fill: #6b6b6b; }

  .bxu { fill: #eef2f6; stroke: #7e97ae; stroke-width: 1.4; }
  .bxc { fill: #eef4ef; stroke: #7fa389; stroke-width: 1.6; }
  .hdu { fill: #dce6ee; }
  .hdc { fill: #dcebe0; }
  .ln  { stroke: #8a8880; stroke-width: 1.5; fill: none; }
  .lnd { stroke: #a8a6a0; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
</style>

<defs>
  <marker id="m" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#8a8880"/>
  </marker>
  <marker id="md" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#a8a6a0"/>
  </marker>
</defs>

<rect x="0" y="0" width="980" height="740" fill="#ffffff"/>

<text x="24" y="30" class="ttl">Modelo de entidades — nutriapp</text>
<text x="24" y="50" class="sub">Las cantidades siempre en CRUDO. Verde = dato de referencia compartido; azul = datos del usuario.</text>

<!-- ============ FILA 1 ============ -->
<!-- User -->
<rect x="24" y="72" width="252" height="150" rx="6" class="bxu"/>
<rect x="24" y="72" width="252" height="26" rx="6" class="hdu"/>
<rect x="24" y="90" width="252" height="8" class="hdu" stroke="none"/>
<text x="36" y="90" class="ent">User</text>
<text x="36" y="116" class="att"><tspan class="pk">id</tspan></text>
<text x="36" y="131" class="att">email · password_hash</text>
<text x="36" y="146" class="att">name</text>
<text x="36" y="161" class="att">age · height_cm · weight_kg</text>
<text x="36" y="176" class="att">sexo</text>
<text x="36" y="191" class="att">nivel_actividad</text>
<text x="36" y="206" class="att">objetivo  <tspan class="rel">(lista cerrada)</tspan></text>

<!-- flecha User -> Plan -->
<path d="M278,140 L336,140" class="ln" marker-end="url(#m)"/>
<text x="307" y="132" class="car" text-anchor="middle">1:N</text>

<!-- Plan -->
<rect x="338" y="72" width="252" height="150" rx="6" class="bxu"/>
<rect x="338" y="72" width="252" height="26" rx="6" class="hdu"/>
<rect x="338" y="90" width="252" height="8" class="hdu" stroke="none"/>
<text x="350" y="90" class="ent">Plan</text>
<text x="350" y="116" class="att"><tspan class="pk">id</tspan></text>
<text x="350" y="131" class="att"><tspan class="fk">user_id →</tspan></text>
<text x="350" y="146" class="att">nombre</text>
<text x="350" y="161" class="att">fecha_inicio · fecha_fin</text>
<text x="350" y="176" class="att">origen  <tspan class="rel">(ia | manual)</tspan></text>
<text x="350" y="191" class="att">creado_en</text>

<!-- flecha Plan -> Analisis -->
<path d="M592,140 L650,140" class="lnd" marker-end="url(#md)"/>
<text x="621" y="132" class="car" text-anchor="middle">1:N</text>

<!-- Analisis -->
<rect x="652" y="72" width="300" height="150" rx="6" class="bxu"/>
<rect x="652" y="72" width="300" height="26" rx="6" class="hdu"/>
<rect x="652" y="90" width="300" height="8" class="hdu" stroke="none"/>
<text x="664" y="90" class="ent">Analisis</text>
<text x="664" y="116" class="att"><tspan class="pk">id</tspan></text>
<text x="664" y="131" class="att"><tspan class="fk">user_id →</tspan>  ·  <tspan class="fk">plan_id →</tspan></text>
<text x="664" y="146" class="att">estado  <tspan class="rel">(pendiente…completado)</tspan></text>
<text x="664" y="161" class="att">entrada · resultado  <tspan class="rel">(JSON)</tspan></text>
<text x="664" y="176" class="att">error · intentos</text>
<text x="664" y="191" class="att">creado_en · actualizado_en</text>
<text x="664" y="210" class="rel">trabajo asíncrono: lo procesa el worker</text>

<!-- flecha Plan -> ComidaPlanificada (abajo) -->
<path d="M464,224 L464,266" class="ln" marker-end="url(#m)"/>
<text x="480" y="250" class="car">1:N</text>

<!-- ============ FILA 2 ============ -->
<!-- ComidaPlanificada -->
<rect x="338" y="268" width="252" height="140" rx="6" class="bxu"/>
<rect x="338" y="268" width="252" height="26" rx="6" class="hdu"/>
<rect x="338" y="286" width="252" height="8" class="hdu" stroke="none"/>
<text x="350" y="286" class="ent">ComidaPlanificada</text>
<text x="350" y="312" class="att"><tspan class="pk">id</tspan></text>
<text x="350" y="327" class="att"><tspan class="fk">plan_id →</tspan></text>
<text x="350" y="342" class="att">fecha</text>
<text x="350" y="357" class="att">momento  <tspan class="rel">(desayuno…cena)</tspan></text>
<text x="350" y="372" class="att"><tspan class="fk">receta_id →</tspan></text>
<text x="350" y="387" class="att">raciones</text>

<!-- flecha ComidaPlanificada -> Receta -->
<path d="M592,336 L650,336" class="ln" marker-end="url(#m)"/>
<text x="621" y="328" class="car" text-anchor="middle">N:1</text>

<!-- Receta -->
<rect x="652" y="268" width="300" height="140" rx="6" class="bxu"/>
<rect x="652" y="268" width="300" height="26" rx="6" class="hdu"/>
<rect x="652" y="286" width="300" height="8" class="hdu" stroke="none"/>
<text x="664" y="286" class="ent">Receta</text>
<text x="664" y="312" class="att"><tspan class="pk">id</tspan></text>
<text x="664" y="327" class="att"><tspan class="fk">user_id →</tspan>  <tspan class="rel">(nulo = del sistema)</tspan></text>
<text x="664" y="342" class="att">nombre · pasos</text>
<text x="664" y="357" class="att">metodo_coccion  <tspan class="rel">(plancha, horno…)</tspan></text>
<text x="664" y="372" class="att">raciones</text>
<text x="664" y="387" class="att">origen  <tspan class="rel">(ia | manual)</tspan></text>

<!-- flecha Receta -> IngredienteReceta -->
<path d="M802,410 L802,452" class="ln" marker-end="url(#m)"/>
<text x="818" y="436" class="car">1:N</text>

<!-- ============ FILA 3 ============ -->
<!-- IngredienteReceta -->
<rect x="652" y="454" width="300" height="112" rx="6" class="bxu"/>
<rect x="652" y="454" width="300" height="26" rx="6" class="hdu"/>
<rect x="652" y="472" width="300" height="8" class="hdu" stroke="none"/>
<text x="664" y="472" class="ent">IngredienteReceta</text>
<text x="664" y="498" class="att"><tspan class="pk">id</tspan></text>
<text x="664" y="513" class="att"><tspan class="fk">receta_id →</tspan>  ·  <tspan class="fk">alimento_id →</tspan></text>
<text x="664" y="528" class="att">gramos  <tspan class="rel">(en crudo)</tspan></text>
<text x="664" y="552" class="rel">La cantidad vive aquí, no en el alimento</text>

<!-- flecha IngredienteReceta -> Alimento -->
<path d="M650,510 L594,510" class="ln" marker-end="url(#m)"/>
<text x="622" y="502" class="car" text-anchor="middle">N:1</text>

<!-- Alimento -->
<rect x="338" y="454" width="252" height="216" rx="6" class="bxc"/>
<rect x="338" y="454" width="252" height="26" rx="6" class="hdc"/>
<rect x="338" y="472" width="252" height="8" class="hdc" stroke="none"/>
<text x="350" y="472" class="ent">Alimento</text>
<text x="350" y="498" class="att"><tspan class="pk">id</tspan></text>
<text x="350" y="513" class="att">nombre  <tspan class="rel">(específico)</tspan></text>
<text x="350" y="528" class="att">categoria  <tspan class="rel">(agrupa y busca)</tspan></text>
<text x="350" y="543" class="att">estado  <tspan class="rel">(crudo | cocido…)</tspan></text>
<text x="350" y="558" class="att">kcal_100</text>
<text x="350" y="573" class="att">proteinas_100</text>
<text x="350" y="588" class="att">grasas_100</text>
<text x="350" y="603" class="att">hidratos_100</text>
<text x="350" y="618" class="att">origen  <tspan class="rel">(seed | api | manual)</tspan></text>
<text x="350" y="633" class="att">id_externo · nombre_externo</text>
<text x="350" y="655" class="rel">Catálogo compartido. Macros por 100 g.</text>

<!-- Nota lateral izquierda -->
<rect x="24" y="454" width="290" height="216" rx="6" fill="#faf9f7" stroke="#d9d7d2" stroke-width="1"/>
<text x="38" y="478" class="ent">Lo que NO es una tabla</text>
<text x="38" y="502" class="att">Lista de la compra</text>
<text x="38" y="520" class="rel">Se calcula al vuelo recorriendo las comidas</text>
<text x="38" y="535" class="rel">del plan y sumando ingredientes por alimento.</text>
<text x="38" y="550" class="rel">No se guarda: así nunca queda desfasada</text>
<text x="38" y="565" class="rel">respecto al plan.</text>
<text x="38" y="592" class="ent">Por qué la cantidad va aparte</text>
<text x="38" y="614" class="rel">Alimento guarda los macros por 100 g, que son</text>
<text x="38" y="629" class="rel">fijos. Los 200 g de pollo pertenecen a UNA</text>
<text x="38" y="644" class="rel">receta concreta, no al pollo. Corriges el pollo</text>
<text x="38" y="659" class="rel">una vez y se arreglan todas las recetas.</text>

<!-- Nota User -->
<rect x="24" y="244" width="290" height="164" rx="6" fill="#faf9f7" stroke="#d9d7d2" stroke-width="1"/>
<text x="38" y="268" class="ent">Listas cerradas (no texto libre)</text>
<text x="38" y="292" class="att">objetivo</text>
<text x="38" y="307" class="rel">perder_grasa · mantener · ganar_musculo</text>
<text x="38" y="329" class="att">momento</text>
<text x="38" y="344" class="rel">desayuno · almuerzo · comida · merienda · cena</text>
<text x="38" y="366" class="att">estado (alimento)</text>
<text x="38" y="381" class="rel">crudo · cocido · asado · frito</text>
<text x="38" y="399" class="rel">Valores predecibles para la interfaz y para la IA.</text>

<text x="24" y="700" class="rel">→ = clave foránea    ·    1:N = uno a muchos    ·    N:1 = muchos a uno    ·    línea discontinua = relación opcional</text>
<text x="24" y="720" class="rel">Receta y Alimento forman una relación muchos-a-muchos resuelta con IngredienteReceta, que además guarda la cantidad.</text>
</svg>
