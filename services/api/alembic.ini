# Configuración de Alembic para el servicio "api".
#
# Aquí NO hay URL de base de datos a propósito: la construye env.py llamando a
# app.config.database_url(), la misma función que usa el factory de Flask. Si
# se escribiera aquí, las credenciales vivirían en dos sitios y un fichero
# versionado acabaría con la contraseña dentro.

[alembic]
script_location = migrations

# Para que env.py pueda hacer "from app...". Alembic se ejecuta desde
# services/api (o desde /app dentro del contenedor).
prepend_sys_path = .

# Prefijo de fecha y hora en el nombre del fichero: así los ficheros se ordenan
# igual que el histórico y se ve de un vistazo cuándo se creó cada migración.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
